<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teleprompter — by AGUITECH</title>
<meta name="description" content="Teleprompter web profesional: velocidad ajustable, mirror mode, multi-script, atajos de teclado, fullscreen">
<meta property="og:title" content="Teleprompter — AGUITECH">
<meta property="og:site_name" content="AGUITECH">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<!-- ============ APP SHELL ============ -->
<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h18v2H3V4zm0 4h18v2H3V8zm0 4h18v2H3v-2zm0 4h18v2H3v-2z"/></svg>
        AGUITECH Teleprompter
      </div>
      <button class="icon-btn" id="sidebar-toggle" title="Ocultar sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>

    <div class="sidebar-section">
      <label>📝 Script</label>
      <select id="script-select" class="full-width">
        <option value="">— Nuevo script —</option>
      </select>
      <div class="row-2">
        <input type="text" id="script-name" placeholder="Nombre del script" class="full-width">
      </div>
      <div class="row-2">
        <button id="btn-save" class="btn-primary full-width">💾 Guardar</button>
        <button id="btn-delete" class="btn-danger" title="Borrar script">🗑️</button>
      </div>
    </div>

    <div class="sidebar-section">
      <label>⚡ Velocidad <span id="speed-display">30</span> px/s</label>
      <input type="range" id="speed" min="5" max="200" value="30" step="1">
      <div class="hint">← → ajustar</div>
    </div>

    <div class="sidebar-section">
      <label>🔠 Tamaño <span id="size-display">48</span>px</label>
      <input type="range" id="font-size" min="20" max="120" value="48" step="2">
      <div class="hint">+ − ajustar</div>
    </div>

    <div class="sidebar-section">
      <label>📏 Ancho del prompter</label>
      <input type="range" id="width" min="40" max="100" value="80" step="5">
      <div class="hint"><span id="width-display">80</span>%</div>
    </div>

    <div class="sidebar-section">
      <label>🎨 Color</label>
      <div class="color-row">
        <button class="color-swatch active" data-color="#ffffff" style="background:#ffffff" title="Blanco"></button>
        <button class="color-swatch" data-color="#ffff00" style="background:#ffff00" title="Amarillo"></button>
        <button class="color-swatch" data-color="#00ff00" style="background:#00ff00" title="Verde"></button>
        <button class="color-swatch" data-color="#ff6b6b" style="background:#ff6b6b" title="Rojo"></button>
        <button class="color-swatch" data-color="#00d4ff" style="background:#00d4ff" title="Cian"></button>
      </div>
    </div>

    <div class="sidebar-section">
      <label>🪞 Modos</label>
      <button id="btn-mirror" class="toggle-btn">Mirror: OFF</button>
      <button id="btn-countdown" class="toggle-btn">Countdown: OFF</button>
    </div>

    <div class="sidebar-section">
      <label>⌨️ Atajos</label>
      <div class="shortcuts">
        <div><kbd>Space</kbd> Play / Pausa</div>
        <div><kbd>R</kbd> Reiniciar</div>
        <div><kbd>F</kbd> Fullscreen</div>
        <div><kbd>M</kbd> Mirror</div>
        <div><kbd>+</kbd> <kbd>−</kbd> Tamaño</div>
        <div><kbd>←</kbd> <kbd>→</kbd> Velocidad</div>
      </div>
    </div>

    <div class="sidebar-footer">
      <a href="https://aguitech.com.mx" target="_blank">AGUITECH</a> · v1.0
    </div>
  </aside>

  <!-- ============ MAIN: EDITOR + PREVIEW ============ -->
  <main class="main">
    <div class="toolbar">
      <button class="icon-btn" id="sidebar-toggle-2" title="Mostrar sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <div class="toolbar-title">
        <span id="current-script-name">Sin título</span>
      </div>
      <div class="toolbar-actions">
        <button id="btn-test" class="btn-secondary" title="Cargar texto de prueba">🧪 Texto prueba</button>
        <button id="btn-play" class="btn-play">▶ Reproducir</button>
        <button id="btn-fullscreen" class="btn-secondary" title="F: Fullscreen">⛶ Fullscreen</button>
      </div>
    </div>

    <div class="workspace">
      <!-- Editor -->
      <div class="editor-pane" id="editor-pane">
        <textarea id="editor" placeholder="Escribe aquí tu guion o pega el texto...

Tips:
• Usa párrafos cortos para respiración natural
• El teleprompter resaltará la palabra actual
• Usa ⌨️ Space para iniciar/pausar
• M para mirror mode (reflejo en cristal)"></textarea>
        <div class="editor-stats">
          <span><span id="stat-words">0</span> palabras</span>
          <span><span id="stat-chars">0</span> caracteres</span>
          <span>~<span id="stat-time">0</span> min lectura</span>
        </div>
      </div>

      <!-- Preview -->
      <div class="preview-pane" id="preview-pane">
        <div class="prompter-wrapper" id="prompter-wrapper">
          <div class="prompter-overlay top"></div>
          <div class="prompter-overlay bottom"></div>
          <div class="prompter-eyeline"></div>
          <div class="prompter-scroll" id="prompter-scroll">
            <div class="prompter-content" id="prompter-content"></div>
          </div>
          <div class="prompter-countdown" id="prompter-countdown" style="display:none;">
            <span id="countdown-text">3</span>
          </div>
          <div class="prompter-controls">
            <button class="prompter-btn" id="prompter-play" title="Space">▶</button>
            <button class="prompter-btn" id="prompter-reset" title="R">↻</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ============ FLOATING CONTROLS (fullscreen mode) ============ -->
<div class="floating-controls" id="floating-controls" style="display:none;">
  <button id="float-play" title="Space">⏯</button>
  <button id="float-reset" title="R">↻</button>
  <button id="float-exit" title="Esc">✕</button>
</div>

<script src="../assets/app.js"></script>
</body>
</html>
